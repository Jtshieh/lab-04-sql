[project]
name = "sql-lab"
version = "0.1.0"
description = "SQL work for DS2022"
requires-python = ">=3.12"
dependencies = [
    "mycli>=2.27.0",
    "mysql-connector-python>=26.7.0",
    "pandas>=3.0.6",
]

[project.scripts]
sql-lab = "sql_lab.process:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
